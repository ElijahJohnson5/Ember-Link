[package]
name = "ember-link"
version = "0.0.1"
edition = "2021"

[dependencies]
server = { path = "../../packages/server", features = ["tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

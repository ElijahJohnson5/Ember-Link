language: 'rust'
layer: 'application'

dependsOn:
  - 'protocol'
  - 'server'

tasks:
  flamegraph:
    script: 'CARGO_PROFILE_RELEASE_DEBUG=true PERF=/usr/lib/linux-tools/6.8.0-60-generic/perf cargo flamegraph'
    preset: 'server'
  run:
    script: 'cargo run'
    preset: 'server'
  test:
    script: 'cargo test'
  test-cov:
    script: 'llvm-cov --html'
  build-release:
    script: 'cargo build --release'
  build-docker:
    script: 'docker build -f "apps/ember-link/Dockerfile" . -t emberlinkio/ember-link:latest'
    options:
      runFromWorkspaceRoot: true

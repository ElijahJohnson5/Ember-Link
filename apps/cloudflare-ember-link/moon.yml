language: 'rust'
layer: 'application'

dependsOn:
  - 'protocol'
  - 'server'

tasks:
  run:
    script: 'npx wrangler dev'
    preset: 'server'
  test:
    script: 'cargo test'
  test-cov:
    script: 'llvm-cov --html'
  build-release:
    script: 'cargo build --release'

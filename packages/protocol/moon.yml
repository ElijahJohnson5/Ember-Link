language: 'typescript'
layer: 'library'

tasks:
  build:
    script: 'yarn build'
    deps:
      - 'generate-ts'
      - 'generate-rs'
      - 'test'
    outputs:
      - dist/**/*
  generate-rs:
    script: |
      cargo run -p bare-rs -- compile ./src/schema.bare -o ./src/generated.rs -d=Serialize,Deserialize,Eq,Clone,PartialEq -u="use serde::{Serialize, Deserialize};" --serde && rustfmt ./src/generated.rs
    outputs:
      - src/generated.rs
    options:
      cache: false
  generate-ts:
    script: |
      yarn bare compile ./src/schema.bare -o ./src/generated.ts
    outputs:
      - src/generated.ts
    options:
      cache: false
  test:
    script: 'cargo test'
    deps:
      - generate-rs
    options:
      cache: false

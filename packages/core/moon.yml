language: 'typescript'
layer: 'library'

dependsOn:
  - 'event-emitter'
  - 'protocol'
  - 'storage'

tasks:
  build:
    script: 'yarn build'
    deps:
      - 'event-emitter:build'
      - 'protocol:build'
      - 'storage:build'
    outputs:
      - 'dist/**/*'
  test:
    script: 'yarn test'
    deps:
      - 'event-emitter:build'
      - 'protocol:build'
      - 'storage:build'
